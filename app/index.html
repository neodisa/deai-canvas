<!DOCTYPE html><html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deai Canvas</title>
<!-- Застосунок «Deai Canvas» (PWA): маніфест лише тут, у локальному інструменті.
     Оболонка опублікованих превʼю (`serve.py`, `preview_index_html`) його НЕ має —
     це інший продукт, для рецензентів. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#29332E">
<link rel="stylesheet" href="styles.css">
</head><body>
<div id="sprite"></div>
<nav id="tabs" class="tabs" aria-label="Відкриті задачі"></nav>
<div id="bar" class="bar-mount">Завантаження…</div>
<div id="stage" class="cv-stage"><iframe id="frame" class="cv-frame"></iframe></div>
<div id="canvas" class="cv-canvas" hidden><div id="world" class="cv-world"></div>
  <div id="cv-zoom" class="cv-zoom">100%</div>
  <div id="canvas-hint" class="cv-canvas-hint">тягни — рух · колесо — зум · клік по макету — відкрити в повний розмір (там живий інтерактив і коментарі)</div>
</div>
<!-- Острівець унизу робочої області (12.10.2026; інтерактивний — 0.25.0): сегмент стану Клода + інструменти.
     `role="status"` — лише на ПОСТІЙНОМУ вузлі сегмента Клода (`app.js` paintClaude оновлює його на місці);
     кнопки інструментів (`#isl-tools`) у живу область не входять. -->
<div id="hud" class="cv-hud"><div class="island" role="group" aria-label="Інструменти">
  <div id="claude-hud" class="isl-claude" role="status"></div><div id="isl-tools" class="isl-tools"></div>
</div></div>
<div id="insp-panel" class="insp" hidden></div>
<!-- comment-layer у режимі «полотно» для пінів на «Огляді» (T-45). Класичні
     скрипти ДО модуля: `app.js` їх не імпортує, а бере з window. Адаптер каналу
     «Команда» (модуль `supabase-comments`) — ліниво, з `/api/module-client/…`
     (overview-comments.js). -->
<script src="vendor/anchor.min.js"></script>
<script src="vendor/comment-layer.min.js"></script>
<script src="vendor/local-adapter.js"></script>
<script type="module" src="app.js"></script>
</body></html>
