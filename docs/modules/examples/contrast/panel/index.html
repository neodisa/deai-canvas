<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Контраст</title>
  <link rel="stylesheet" href="contrast.css">
</head>
<body>
  <!-- The core adds the `dk-*` styles and the `window.deai` bridge to the panel itself. -->
  <div class="sum">
    <span id="sum" class="dk-muted"></span>
    <button id="pick" type="button" class="dk-btn dk-btn--sm" aria-pressed="false"></button>
  </div>
  <ul id="list" class="dk-list"></ul>
  <div id="tmp" class="tmp" hidden>
    <span id="tmp-t" class="dk-muted"></span>
    <button id="revert" type="button" class="dk-btn dk-btn--sm"></button>
  </div>
  <script src="contrast.js"></script>
</body>
</html>
