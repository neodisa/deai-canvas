<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Нотатки сторінок</title>
  <link rel="stylesheet" href="notes.css">
</head>
<body>
  <!-- Стилі `dk-*` і міст `window.deai` ядро підʼєднує до панелі саме. -->
  <h3 id="title">…</h3>
  <textarea id="note" class="dk-field" rows="12" placeholder="Нотатка до цієї сторінки" disabled></textarea>
  <div class="actions">
    <button id="save" type="button" class="dk-btn dk-btn--primary" disabled>Зберегти</button>
    <span id="status" class="dk-muted"></span>
  </div>
  <script src="notes.js"></script>
</body>
</html>
