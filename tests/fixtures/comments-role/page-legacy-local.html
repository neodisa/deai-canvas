<!DOCTYPE html><html><head><base href="{ORIGIN}/it-assets/it1/"><title>t</title></head><body><h1>x</h1>
<script src="{ORIGIN}/app/vendor/local-adapter.js"></script>
<script src="{ORIGIN}/app/vendor/comment-layer.min.js"></script>
<script type="module" src="{ORIGIN}/app/vendor/inspector.js?ds=tool&sp={SP}"></script>
<script>
(function () {
  var init = function () {
    var store = window.CommentLayerLocal({ endpoint: '{ORIGIN}/api/local-comments' });
    store.ready.then(function () {
      window.CommentLayer.init({ projectId: 'x/local', storage: store,
        version: '1', local: true,
        audiences: (function () {
          var uk = { local: 'AI', team: 'Команда' };
          var en = { local: 'AI', team: 'Team' };
          var L = uk;
          try { if (localStorage.getItem('dc-lang') === 'en') L = en; } catch (e) {}
          // `icon` — імена з набору САМОГО коментатора (`bot`/`team`), не наші
          // канали: віджет малює іконку за іменем і не дізнається, що таке
          // «local». Стоїть у хвості обʼєкта свідомо — так регексп охоронця
          // `AudienceTabsPerChannel`, що приколює пару «id ↔ підпис ↔ active»,
          // лишається чинним і не мусить знати про іконки.
          return [{ id: 'local', label: L.local, active: true, icon: 'bot' },
                  { id: 'project', label: L.team, active: false, icon: 'team' }];
        })(),
        onAudience: function (id) {
          window.parent.postMessage({ type: 'dc-audience', ch: id }, '*');
        } });
    });
  };
  if (document.readyState !== 'loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script></body></html>
